<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acak Tempat Duduk Keren</title>
    <style>
        :root {
            /* Warna Tema Gelap Elegan */
            --bg-gradient: radial-gradient(circle at top left, #2a2a3e, #0f0f16);
            --card-bg: rgba(30, 30, 46, 0.6);
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
            --accent: #4361ee;
            --accent-hover: #3a56d4;
            --border-light: rgba(255, 255, 255, 0.1);
            --seat-bg: rgba(255, 255, 255, 0.05);
            --seat-text: #ffffff;
            --gap: 14px;
            --kolom-grid: 4; 
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 15px; 
            color: var(--text-main);
        }
        
        .app-container { 
            /* Efek Glassmorphism */
            background-color: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            border-radius: 20px; 
            padding: 40px 30px; 
            width: 100%; 
            max-width: 600px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: all 0.4s ease-in-out;
        }
        
        h1 { 
            font-size: 26px; 
            font-weight: 700; 
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: var(--text-main);
            text-align: center;
        }
        
        p.subtitle { 
            font-size: 14px; 
            color: var(--text-muted); 
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-container { width: 100%; }
        .input-group { margin-bottom: 22px; }
        .input-group label { 
            display: block; 
            font-size: 13px; 
            font-weight: 600; 
            letter-spacing: 0.5px;
            color: #ced4da; 
            margin-bottom: 8px; 
        }
        
        .input-group input, .input-group select { 
            width: 100%; 
            padding: 14px 16px; 
            font-size: 15px; 
            color: #ffffff;
            border: 1px solid var(--border-light); 
            border-radius: 10px; 
            outline: none; 
            background-color: rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        /* Ubah warna teks option biar kelihatan pas di-klik */
        .input-group select option {
            background-color: #1e1e2e;
            color: #ffffff;
        }
        
        .input-group input:focus, .input-group select:focus { 
            border-color: var(--accent);
            background-color: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            padding: 16px 24px; 
            font-size: 16px; 
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 10px; 
            width: 100%; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
        }
        
        button:hover { 
            background-color: var(--accent-hover); 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.4);
        }
        button:active { transform: translateY(1px); }
        
        .header-area { 
            display: flex; 
            justify-content: space-between; 
            width: 100%; 
            gap: 15px; 
            margin-bottom: 30px; 
        }
        
        .meja-guru { 
            flex: 1; 
            border: 1px dashed rgba(255, 255, 255, 0.2); 
            color: var(--text-muted); 
            font-size: 12px; 
            font-weight: 600; 
            text-align: center; 
            padding: 12px; 
            border-radius: 8px; 
            background-color: rgba(255, 255, 255, 0.02);
            letter-spacing: 1px;
        }
        
        .papan-tulis { 
            flex: 2; 
            background-color: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: white; 
            font-size: 13px; 
            font-weight: 600; 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 8px; 
            letter-spacing: 2px; 
        }
        
        .grid-kelas { 
            display: flex; 
            flex-wrap: wrap;
            justify-content: center; 
            gap: var(--gap); 
            width: 100%; 
            margin-bottom: 20px;
        }
        
        .card-pasangan { 
            display: flex; 
            width: calc((100% - ((var(--kolom-grid) - 1) * var(--gap))) / var(--kolom-grid));
            background-color: transparent; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 10px; 
            padding: 6px; 
            gap: 6px; 
            opacity: 0; 
            animation: fadeInUp 0.4s ease forwards; 
        }
        
        @keyframes fadeInUp { 
            0% { opacity: 0; transform: translateY(15px) scale(0.95); } 
            100% { opacity: 1; transform: translateY(0) scale(1); } 
        }
        
        .meja { 
            flex: 1; 
            aspect-ratio: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 16px; 
            color: var(--seat-text); 
            background-color: var(--seat-bg); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        
        .meja:hover { 
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .footer { 
            margin-top: 40px; 
            text-align: center; 
            font-size: 12px; 
            color: rgba(255, 255, 255, 0.4); 
        }
        
        .footer p { margin: 4px 0; }
        .footer .jam { font-weight: 600; color: rgba(255, 255, 255, 0.7); }
    </style>
</head>
<body>

    <main id="layar-pengaturan" class="app-container">
        <h1>Aplikasi Acak Tempat Duduk</h1>
        <p class="subtitle">Isi datanya biar bisa langsung diacak.</p>
        
        <div class="form-container">
            <div class="input-group">
                <label for="input-kelas">Kelas</label>
                <input type="text" id="input-kelas" placeholder="contoh: 7A1" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="input-jumlah">Berapa Orang?  (maks 35)</label>
                <input type="number" id="input-jumlah" placeholder="contoh: 28" min="1" max="35">
            </div>

            <div class="input-group">
                <label for="input-format">Model Meja</label>
                <select id="input-format">
                    <option value="individu">Sendiri-sendiri</option>
                    <option value="pasangan">Sebangku (Berdua)</option>
                </select>
            </div>
            
            <button onclick="mulaiAplikasi()">Buat Ruang Kelas</button>
        </div>
    </main>

    <main id="layar-utama" class="app-container" style="display: none;">
        <h1 id="display-nama-kelas">Kelas</h1>
        <p class="subtitle">Rolling Tempat Duduk Otomatis</p>
        
        <div class="header-area">
            <div class="meja-guru">MEJA GURU</div>
            <div class="papan-tulis">PAPAN TULIS</div>
        </div>
        
        <div id="kelas" class="grid-kelas"></div>

        <button onclick="acakTempatDuduk()">Acak Sekarang!</button>
    </main>

    <footer class="footer">
        <p class="jam" id="waktu-sekarang"></p>
        <p>by Fahim Al-Ghifari</p>
    </footer>

    <script>
        const suaraAcak = new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3');
        let totalSiswa = 0;
        let formatMeja = 'individu';

        function mulaiAplikasi() {
            const inputKelas = document.getElementById('input-kelas').value.trim();
            const inputJumlah = parseInt(document.getElementById('input-jumlah').value);
            const inputFormat = document.getElementById('input-format').value;

            if (!inputKelas) {
                alert("Eh, isi nama kelasnya dulu dong.");
                return;
            }
             if (isNaN(inputJumlah) || inputJumlah > 35) {
                alert("Masukin jumlah siswanya yang bener ya.");
                return;
            }
      

            totalSiswa = inputJumlah;
            formatMeja = inputFormat;

            // Logika Perhitungan Ruang
            const mejaPerCard = formatMeja === 'pasangan' ? 2 : 1;
            const totalItemGrid = Math.ceil(totalSiswa / mejaPerCard); 
            
            // Cari jumlah kolom yang paling pas (kotak)
            const kolomGrid = Math.ceil(Math.sqrt(totalItemGrid));

            // Kirim data kolom ke CSS
            document.documentElement.style.setProperty('--kolom-grid', kolomGrid);

            // Ganti Layar
            document.getElementById('display-nama-kelas').innerText = inputKelas.toUpperCase();
            document.getElementById('layar-pengaturan').style.display = 'none';
            document.getElementById('layar-utama').style.display = 'flex';

            const urutanAwal = Array.from({ length: totalSiswa }, (_, i) => i + 1);
            renderKelas(urutanAwal);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderKelas(susunan) {
            const wadahKelas = document.getElementById('kelas');
            wadahKelas.innerHTML = ''; 
            
            const fragment = document.createDocumentFragment();
            let cardPasangan = document.createElement('div');
            cardPasangan.className = 'card-pasangan';
            let urutanCard = 0; 
            
            const mejaPerCard = formatMeja === 'pasangan' ? 2 : 1;

            susunan.forEach((nomorAbsen, index) => {
                const meja = document.createElement('div');
                meja.textContent = nomorAbsen;
                meja.className = 'meja'; 
                
                cardPasangan.appendChild(meja);

                if ((index + 1) % mejaPerCard === 0 || index === susunan.length - 1) {
                    cardPasangan.style.animationDelay = `${urutanCard * 0.03}s`;
                    fragment.appendChild(cardPasangan);
                    
                    urutanCard++; 
                    cardPasangan = document.createElement('div');
                    cardPasangan.className = 'card-pasangan';
                }
            });

            wadahKelas.appendChild(fragment);
        }

        function acakTempatDuduk() {
            suaraAcak.currentTime = 0; 
            suaraAcak.play().catch(e => console.log("Audio aman, jalan setelah klik."));

            let susunanBaru = Array.from({ length: totalSiswa }, (_, i) => i + 1);
            shuffleArray(susunanBaru);
            
            renderKelas(susunanBaru);
        }

        function updateJam() {
            const sekarang = new Date();
            const opsiTanggal = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            const tanggal = sekarang.toLocaleDateString('id-ID', opsiTanggal);
            const waktu = sekarang.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('waktu-sekarang').innerText = `${tanggal} • ${waktu} WIB`;
        }
        setInterval(updateJam, 1000);
        updateJam();
    </script>
</body>
</html>
</body>
</html>
